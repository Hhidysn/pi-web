<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Web</title>
<p id="status">正在打开 Pi Web…</p>
<script>
(async () => {
  try {
    // Only the loopback development launcher uses this page.
    if (["127.0.0.1", "localhost", "[::1]"].includes(location.hostname)) {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter((registration) => {
          const worker = registration.active || registration.waiting || registration.installing;
          if (!worker) return false;
          const url = new URL(worker.scriptURL);
          return url.origin === location.origin && url.pathname === "/sw.js";
        }).map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((key) => key.startsWith("pi-web-static-")).map((key) => caches.delete(key)));
      }
    }
    location.replace("/");
  } catch {
    document.getElementById("status").textContent = "未能打开 Pi Web，请关闭此页后重新点击快捷方式。";
  }
})();
</script>
</html>
